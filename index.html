<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoodScape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="reminder-card" id="card">
    <div class="reminder-quote" id="quote">
      Pick your vibe today 🌈
    </div>
    <div class="mood-buttons">
      <!-- Emoji buttons -->
      <button class="mood-btn" data-mood="😂">😂</button>
      <button class="mood-btn" data-mood="😍">😍</button>
      <button class="mood-btn" data-mood="😒">😒</button>
      <button class="mood-btn" data-mood="😁">😁</button>
      <button class="mood-btn" data-mood="👌">👌</button>
      <button class="mood-btn" data-mood="👍">👍</button>
      <button class="mood-btn" data-mood="❤️">❤️</button>
      <button class="mood-btn" data-mood="😎">😎</button>
      <button class="mood-btn" data-mood="😉">😉</button>
      <button class="mood-btn" data-mood="😜">😜</button>
      <button class="mood-btn" data-mood="🤩">🤩</button>
      <button class="mood-btn" data-mood="😥">😥</button>
      <button class="mood-btn" data-mood="😴">😴</button>
      <button class="mood-btn" data-mood="😫">😫</button>
      <button class="mood-btn" data-mood="🤑">🤑</button>
      <button class="mood-btn" data-mood="😨">😨</button>
      <button class="mood-btn" data-mood="😰">😰</button>
      <button class="mood-btn" data-mood="🥵">🥵</button>
      <button class="mood-btn" data-mood="🥶">🥶</button>
      <button class="mood-btn" data-mood="😵‍💫">😵‍💫</button>
      <button class="mood-btn" data-mood="😡">😡</button>
      <button class="mood-btn" data-mood="😇">😇</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
